name: Build Windows release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/release.yml']

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Check Python syntax
        run: python -m compileall -q app.py run.pyw lumacull
      - name: Build Windows package
        shell: pwsh
        run: ./build.ps1
      - name: Publish versioned download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "from lumacull.config import VERSION; print(VERSION)"
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "Release $tag already exists; leaving its assets unchanged."
            exit 0
          }
          $hash = (Get-FileHash dist/LumaCull-Windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  LumaCull-Windows-x64.zip" | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          gh release create $tag dist/LumaCull-Windows-x64.zip dist/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "光筛 LumaCull $tag" --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }

